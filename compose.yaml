services:
  komga:
    image: gotson/komga:latest
    container_name: mangashelf-komga
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "25600:25600"
    volumes:
      - ./data/komga:/config
      - ./data/library:/data:ro
    environment:
      - TZ=America/Sao_Paulo
    restart: unless-stopped

[project]
name = "mangashelf"
version = "0.1.0"
description = "Bot para baixar, validar e organizar capítulos CBZ para o Komga"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mangashelf = "mangashelf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
